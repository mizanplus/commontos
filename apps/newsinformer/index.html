<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading… — Legal Documents</title>
  <meta name="description" content="" />
  <link rel="stylesheet" href="../../assets/css/legal.css" />
  <style>
    .platform-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      max-width: 900px;
      margin: 40px auto 0;
      padding: 0 24px 64px;
    }
    .platform-card {
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius);
      padding: 20px;
      transition: all var(--transition);
    }
    .platform-card:hover {
      border-color: var(--clr-accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .platform-card .p-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .platform-card .p-icon {
      font-size: 1.4rem;
    }
    .platform-card h3 { font-size: 1rem; font-weight: 600; }
    .platform-card .doc-links { display: flex; flex-direction: column; gap: 8px; }
    .platform-card .doc-link {
      font-size: 0.85rem;
    }
    .loading-pulse {
      background: linear-gradient(90deg, var(--clr-surface) 25%, var(--clr-surface-2) 50%, var(--clr-surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>

  <!-- App Hero -->
  <header class="app-hero">
    <div class="breadcrumb">
      <a href="../../index.html">Legal Docs Hub</a>
      <span>›</span>
      <span id="breadcrumb-name">Loading…</span>
    </div>
    <div class="app-icon-lg" id="hero-icon">⏳</div>
    <h1 id="hero-name">Loading…</h1>
    <p id="hero-desc"></p>
  </header>

  <!-- Platform cards injected here -->
  <main>
    <div class="platform-card-grid" id="platform-grid">
      <!-- Loading skeleton -->
      <div class="platform-card" aria-hidden="true">
        <div class="loading-pulse" style="height:14px;width:60%;margin-bottom:12px"></div>
        <div class="loading-pulse" style="height:12px;width:80%;margin-bottom:8px"></div>
        <div class="loading-pulse" style="height:12px;width:75%"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> mizanplus · <a href="../../index.html">← Back to Hub</a></p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (async function () {
      let meta;
      try {
        const res = await fetch('./meta.json');
        if (!res.ok) throw new Error('meta.json not found');
        meta = await res.json();
      } catch (e) {
        document.getElementById('hero-name').textContent = 'Error loading app data';
        return;
      }

      // Populate hero
      document.title = `${meta.name} — Legal Documents`;
      document.getElementById('breadcrumb-name').textContent = meta.name;
      document.getElementById('hero-icon').textContent = meta.icon || '📄';
      document.getElementById('hero-name').textContent = meta.name;
      document.getElementById('hero-desc').textContent = meta.description || '';

      // Build platform cards
      const grid = document.getElementById('platform-grid');
      grid.innerHTML = (meta.platforms || []).map(p => `
        <div class="platform-card">
          <div class="p-header">
            <span class="p-icon">${p.icon || '📄'}</span>
            <h3>${p.label}</h3>
          </div>
          <div class="doc-links">
            <a class="doc-link" href="${p.id}/terms-of-service.html">📜 Terms of Service</a>
            <a class="doc-link" href="${p.id}/privacy-policy.html">🔒 Privacy Policy</a>
          </div>
          ${p.docsLastUpdated ? `<p style="font-size:0.75rem;color:var(--clr-text-dim);margin-top:12px">Updated: ${p.docsLastUpdated}</p>` : ''}
        </div>
      `).join('');
    })();
  </script>
</body>
</html>
